services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: roi_calculator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roi_calculator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=roi_calculator;Username=postgres;Password=postgres"
      Features__UseInMemoryDatabase: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
